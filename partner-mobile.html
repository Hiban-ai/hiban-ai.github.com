<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>工作夥伴（手機版）— 希絆雲作所</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#48B4E8;--blue-d:#1A8AC0;--blue-dd:#0F5A99;--blue-p:#EBF7FD;--blue-pp:#D0EEFA;
  --yellow:#C8901A;--yellow-p:#FFF7E6;
  --green:#2E8A5E;--green-p:#E8F8F2;
  --red:#D04545;--red-p:#FEF0F0;
  --orange:#D9622A;--orange-p:#FEF3EE;
  --purple:#6B3FA0;--purple-p:#EEE6FA;
  --text:#1A2E40;--text-m:#3D5A70;--text-s:#5B7385;
  --border:#C8E8F6;--bg:#F0F8FE;
  --r:16px;--rs:10px;--nav-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Noto Sans TC',sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.6;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 1rem)}
button,input,select,textarea{font-family:inherit;font-size:1rem}
a{color:var(--blue-dd)}
:focus-visible{outline:3px solid var(--blue-dd);outline-offset:2px}

/* 上方：名字、角色、登出 */
.topbar{display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;background:linear-gradient(135deg,#0F5A99,#1A8AC0);color:#fff}
.topbar .ava{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;flex:none}
.topbar .who{flex:1;min-width:0}
.topbar .name{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .role{font-size:.85rem;opacity:.9}
.topbar .logout{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:20px;padding:.35rem .9rem;font-size:.9rem;font-weight:700;min-height:40px}

main{padding:1rem}
.page{display:none}
.page.active{display:block}
.page-title{font-size:1.25rem;font-weight:700;margin-bottom:.75rem;display:flex;align-items:center;gap:.4rem}
.back{display:inline-flex;align-items:center;gap:.3rem;background:none;border:none;color:var(--blue-dd);font-weight:700;font-size:1rem;padding:.4rem 0;margin-bottom:.4rem;min-height:44px}
.section{font-size:1rem;font-weight:700;color:var(--text-m);margin:1.1rem 0 .55rem;display:flex;align-items:center;gap:.4rem}
.count{background:var(--red);color:#fff;font-size:.8rem;font-weight:700;padding:.05rem .5rem;border-radius:10px}

.card{background:#fff;border-radius:var(--r);padding:1rem;box-shadow:0 2px 10px rgba(26,112,160,.08);margin-bottom:.75rem}
.card.line{border-left:5px solid var(--blue)}
.empty{color:var(--text-s);font-size:.95rem;text-align:center;padding:1.25rem .5rem}
.muted{color:var(--text-s);font-size:.9rem}
.row{display:flex;align-items:center;gap:.5rem}
.spacer{flex:1}

.t-name{font-weight:700;font-size:1.05rem;line-height:1.45}
.price{font-weight:700;color:var(--yellow);font-size:1.1rem;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.45rem 0}
.chip{display:inline-flex;align-items:center;gap:.2rem;padding:.15rem .55rem;border-radius:6px;font-size:.85rem;font-weight:700;background:var(--blue-p);color:var(--blue-dd)}
.chip.green{background:var(--green-p);color:var(--green)}
.chip.orange{background:var(--orange-p);color:var(--orange)}
.chip.yellow{background:var(--yellow-p);color:#7A5508}
.chip.purple{background:var(--purple-p);color:var(--purple)}
.chip.red{background:var(--red-p);color:var(--red)}
.box{border-radius:var(--rs);padding:.55rem .7rem;font-size:.92rem;line-height:1.6;margin:.45rem 0;white-space:pre-wrap;word-break:break-word}
.box.orange{background:var(--orange-p);border:1px solid rgba(217,98,42,.25)}
.box.green{background:var(--green-p);border:1px solid #B5DDC0}
.box.gray{background:var(--bg);border:1px solid var(--border)}
.box .lbl{display:block;font-size:.82rem;font-weight:700;color:var(--text-m);margin-bottom:.15rem;white-space:normal}
.att{display:inline-flex;align-items:center;gap:.25rem;background:var(--blue-p);color:var(--blue-dd);border:1px solid var(--blue-pp);border-radius:14px;padding:.25rem .65rem;font-size:.88rem;font-weight:700;text-decoration:none;margin:.15rem .3rem .15rem 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
summary::-webkit-details-marker{display:none}
details.more{margin:.35rem 0}
details.more summary{cursor:pointer;color:var(--blue-dd);font-weight:700;font-size:.92rem;padding:.35rem 0;min-height:40px;display:flex;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:48px;padding:.55rem 1rem;border-radius:12px;border:none;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none}
.btn.block{width:100%}
.btn.primary{background:linear-gradient(135deg,#0F5A99,#1A8AC0);color:#fff}
.btn.ok{background:linear-gradient(135deg,#2E7D56,#2E9A6A);color:#fff}
.btn.warn{background:linear-gradient(135deg,#D9622A,#D04545);color:#fff}
.btn.ghost{background:#fff;color:var(--blue-dd);border:1.5px solid var(--blue-pp)}
.btn.danger{background:#fff;color:var(--red);border:2px solid var(--red)}
.btn:disabled{background:#E5ECF1;color:var(--text-s);border:none;cursor:not-allowed}
.btns{display:flex;gap:.5rem;margin-top:.6rem}
.btns .btn{flex:1}

/* 首頁 */
.hello{background:#fff;border-radius:var(--r);padding:.85rem 1rem;box-shadow:0 2px 10px rgba(26,112,160,.08);margin-bottom:.9rem}
.income{display:flex;align-items:center;gap:.5rem;width:100%;background:none;border:none;text-align:left;padding:.2rem 0;min-height:44px;color:var(--text-m);font-size:.95rem}
.income b{color:var(--yellow);font-size:1.1rem}
.todo{display:flex;align-items:center;gap:.75rem;width:100%;background:#fff;border:none;border-radius:var(--r);padding:.85rem 1rem;box-shadow:0 2px 10px rgba(26,112,160,.08);margin-bottom:.6rem;text-align:left;min-height:64px;cursor:pointer;border-left:5px solid var(--blue)}
.todo .ic{font-size:1.5rem;flex:none}
.todo .tx{flex:1;min-width:0}
.todo .tt{font-weight:700;font-size:1rem}
.todo .ts{font-size:.88rem;color:var(--text-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .go{color:var(--blue-dd);font-weight:700;flex:none}

/* 分段切換 */
.seg{display:flex;background:#fff;border-radius:12px;padding:4px;gap:4px;margin-bottom:.85rem;box-shadow:0 2px 8px rgba(26,112,160,.06)}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:.55rem .3rem;font-weight:700;color:var(--text-m);min-height:44px}
.seg button[aria-selected="true"]{background:var(--blue-d);color:#fff}

/* 我的：清單 */
.menu{background:#fff;border-radius:var(--r);box-shadow:0 2px 10px rgba(26,112,160,.08);overflow:hidden;margin-bottom:.9rem}
.menu a,.menu button{display:flex;align-items:center;gap:.75rem;width:100%;padding:.9rem 1rem;min-height:56px;background:none;border:none;border-bottom:1px solid var(--bg);color:var(--text);text-decoration:none;font-size:1rem;font-weight:500;text-align:left;cursor:pointer}
.menu a:last-child,.menu button:last-child{border-bottom:none}
.menu .ic{font-size:1.3rem;width:1.6rem;text-align:center}
.menu .arrow{margin-left:auto;color:var(--text-s)}

/* 表單 */
.field{margin-bottom:.85rem}
.field label{display:block;font-size:.92rem;font-weight:700;color:var(--text-m);margin-bottom:.3rem}
.input{width:100%;border:1.5px solid var(--border);border-radius:var(--rs);padding:.7rem .85rem;background:#fff;color:var(--text);min-height:48px}
.input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(72,180,232,.2)}
.input:disabled{background:var(--bg);color:var(--text-m)}
textarea.input{resize:vertical;line-height:1.6}
.err{display:none;background:var(--red-p);border:1.5px solid var(--red);color:var(--red);border-radius:var(--rs);padding:.55rem .75rem;font-size:.92rem;margin-bottom:.75rem}
.hint{font-size:.85rem;color:var(--text-s);margin-top:.25rem}
.field label.upload,.upload{display:flex;align-items:center;justify-content:center;gap:.4rem;border:2px dashed var(--blue);border-radius:var(--rs);background:var(--blue-p);color:var(--blue-dd);font-weight:700;min-height:52px;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.thumb{position:relative;width:76px;height:76px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1.5px solid var(--border)}
.thumb button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;border:2px solid #fff;font-weight:700;font-size:.85rem}
.filechip{display:flex;align-items:center;gap:.5rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.4rem .6rem;margin-top:.4rem;font-size:.92rem}
.filechip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip button{border:none;background:none;color:var(--red);font-weight:700;min-width:40px;min-height:40px}

/* 限量任務：挑選卡片 */
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}
.slot{border:2px solid var(--border);border-radius:12px;padding:.55rem .6rem;background:#fff;text-align:left;font-size:.88rem;min-height:64px}
.slot.sel{border-color:var(--blue-d);background:var(--blue-p)}
.slot.taken{background:#F1F4F6;color:var(--text-s)}
.slot .code{font-weight:700}
.pager{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.6rem}
.pager .btn{min-height:44px;padding:.35rem .8rem;font-size:.92rem}

/* 下方導覽列 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:#fff;border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(26,112,160,.08)}
.nav button{flex:1;border:none;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;color:var(--text-s);font-size:.85rem;font-weight:700;position:relative}
.nav button .ic{font-size:1.35rem;line-height:1}
.nav button[aria-current="page"]{color:var(--blue-dd)}
.nav button[aria-current="page"]::before{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--blue-d)}
.nav .badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:.75rem;font-weight:700;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:none;align-items:center;justify-content:center}

/* 全螢幕表單（回報、拒絕）：class 含 overlay，shared.js 的 ESC 會關閉 */
.sheet-overlay{display:none;position:fixed;inset:0;z-index:60;background:rgba(10,30,50,.5);align-items:flex-end;justify-content:center}
.sheet-overlay.open{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;position:sticky;top:-1rem;background:#fff;padding:.4rem 0;z-index:1}
.sheet-head .t{flex:1;font-weight:700;font-size:1.1rem}
.sheet-head .x{border:none;background:var(--bg);border-radius:50%;width:44px;height:44px;font-size:1.1rem;color:var(--text-m)}

.ann{display:block;width:100%;text-align:left;background:#fff;border:none;border-radius:var(--rs);padding:.75rem .9rem;margin-bottom:.5rem;box-shadow:0 2px 8px rgba(26,112,160,.06);cursor:pointer;min-height:56px}
/* shared.js 的提示訊息：移到導覽列上方，長訊息可換行 */
#_toast{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + .75rem)!important;width:max-content;max-width:92vw;white-space:normal!important;text-align:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;flex:none}
</style>
</head>
<body>

<header class="topbar">
  <div class="ava" id="ava" aria-hidden="true">夥</div>
  <div class="who">
    <div class="name" id="me-name">—</div>
    <div class="role">工作夥伴</div>
  </div>
  <button class="logout" onclick="confirmSignOut()">登出</button>
</header>

<main>
  <!-- 🏠 首頁 -->
  <section class="page" id="page-home" aria-labelledby="h-home">
    <h1 class="page-title" id="h-home" style="position:absolute;left:-9999px">首頁</h1>
    <div class="hello">
      <div style="font-size:1.05rem;font-weight:700" id="hello-text">您好！</div>
      <button class="income" onclick="go('wallet')">💰 本月收入 <b id="home-income">$0</b><span class="muted" id="home-done"></span><span class="spacer"></span><span class="go" style="color:var(--blue-dd);font-weight:700">明細 ›</span></button>
    </div>
    <div class="section">📌 今天要做的事</div>
    <div id="home-todo"><div class="empty">載入中…</div></div>
    <div id="home-notices"></div>
  </section>

  <!-- 🎯 接案 -->
  <section class="page" id="page-take" aria-labelledby="h-take">
    <h1 class="page-title" id="h-take">🎯 接案</h1>
    <div class="section">📋 指派給我的任務 <span class="count" id="take-pending-n" style="display:none"></span></div>
    <div id="take-pending"><div class="empty">載入中…</div></div>
    <div class="section">🎯 限量任務（先接先得）</div>
    <div id="take-grab"><div class="empty">載入中…</div></div>
  </section>

  <!-- 📝 我的任務 -->
  <section class="page" id="page-tasks" aria-labelledby="h-tasks">
    <h1 class="page-title" id="h-tasks">📝 我的任務</h1>
    <div class="seg" role="tablist" aria-label="任務狀態">
      <button role="tab" id="seg-active" aria-selected="true" onclick="setTaskSeg('active')">進行中</button>
      <button role="tab" id="seg-done" aria-selected="false" onclick="setTaskSeg('done')">已完成</button>
    </div>
    <div id="tasks-active"><div class="empty">載入中…</div></div>
    <div id="tasks-done" style="display:none">
      <div class="field"><label for="done-month">月份</label><select class="input" id="done-month" onchange="renderDone()"></select></div>
      <div id="done-list"></div>
    </div>
  </section>

  <!-- 👤 我的 -->
  <section class="page" id="page-me" aria-labelledby="h-me">
    <h1 class="page-title" id="h-me">👤 我的</h1>
    <div class="card" id="me-level" style="display:none"></div>
    <nav class="menu" aria-label="我的功能">
      <button onclick="go('wallet')"><span class="ic">💰</span>錢包（收入明細）<span class="arrow">›</span></button>
      <button onclick="go('notices')"><span class="ic">📢</span>公告<span class="count" id="me-ann-n" style="display:none;margin-left:.4rem"></span><span class="arrow">›</span></button>
      <button onclick="go('issues')"><span class="ic">🚩</span>問題回報<span class="count" id="me-issue-n" style="display:none;margin-left:.4rem"></span><span class="arrow">›</span></button>
      <button onclick="go('profile')"><span class="ic">🧑</span>個人資料<span class="arrow">›</span></button>
    </nav>
    <nav class="menu" aria-label="其他">
      <a href="faq.html"><span class="ic">❓</span>常見問題<span class="arrow">›</span></a>
      <button onclick="switchToDesktop()"><span class="ic">💻</span>切換電腦版<span class="arrow">›</span></button>
      <button onclick="confirmSignOut()"><span class="ic">🚪</span>登出<span class="arrow">›</span></button>
    </nav>
  </section>

  <!-- 我的 → 錢包 -->
  <section class="page" id="page-wallet" aria-labelledby="h-wallet">
    <button class="back" onclick="go('me')">‹ 我的</button>
    <h1 class="page-title" id="h-wallet">💰 錢包</h1>
    <div class="card" style="text-align:center">
      <div class="field" style="text-align:left"><label for="wallet-month">月份</label><select class="input" id="wallet-month" onchange="renderWallet()"></select></div>
      <div class="muted">這個月的收入</div>
      <div style="font-size:2rem;font-weight:700;color:var(--yellow)" id="wallet-total">$0</div>
      <div class="hint">以審核通過的日期計算月份。每月 15 號發放上個月的收入，<a href="faq.html#salary">說明</a></div>
    </div>
    <div id="wallet-list"></div>
  </section>

  <!-- 我的 → 公告 -->
  <section class="page" id="page-notices" aria-labelledby="h-notices">
    <button class="back" onclick="go('me')">‹ 我的</button>
    <h1 class="page-title" id="h-notices">📢 公告</h1>
    <div class="seg" role="tablist" aria-label="公告分類">
      <button role="tab" id="ann-tab-general" aria-selected="true" onclick="setAnnTab('general')">一般公告 <span id="ann-n-general"></span></button>
      <button role="tab" id="ann-tab-task" aria-selected="false" onclick="setAnnTab('task')">任務通知 <span id="ann-n-task"></span></button>
    </div>
    <div id="ann-list"><div class="empty">載入中…</div></div>
    <button class="btn ghost block" style="margin-top:.5rem" onclick="markAllAnnsRead()">全部標為已讀</button>
  </section>

  <!-- 我的 → 問題回報 -->
  <section class="page" id="page-issues" aria-labelledby="h-issues">
    <button class="back" onclick="go('me')">‹ 我的</button>
    <h1 class="page-title" id="h-issues">🚩 問題回報</h1>
    <div class="seg" role="tablist" aria-label="回報對象">
      <button role="tab" id="iss-tab-supervisor" aria-selected="true" onclick="setIssueTab('supervisor')">回報派案人員</button>
      <button role="tab" id="iss-tab-admin" aria-selected="false" onclick="setIssueTab('admin')">回報管理人員</button>
    </div>
    <div class="hint" id="iss-hint" style="margin:-.3rem 0 .7rem"></div>
    <button class="btn primary block" onclick="openIssueForm()">＋ 新增問題回報</button>
    <div class="section">我的回報紀錄</div>
    <div id="iss-list"><div class="empty">載入中…</div></div>
  </section>

  <!-- 我的 → 個人資料 -->
  <section class="page" id="page-profile" aria-labelledby="h-profile">
    <button class="back" onclick="go('me')">‹ 我的</button>
    <h1 class="page-title" id="h-profile">🧑 個人資料</h1>
    <div class="card">
      <div class="row" style="margin-bottom:.6rem"><b>基本資料</b><span class="spacer"></span><button class="btn ghost" id="prof-edit-btn" style="min-height:40px;padding:.3rem .9rem" onclick="toggleProfEdit(true)">修改</button></div>
      <div class="field"><label>姓名</label><input class="input" id="prof-name" disabled></div>
      <div class="field"><label>身分證</label><input class="input" id="prof-idno" disabled></div>
      <div class="field"><label>生日</label><input class="input" id="prof-birthday" disabled></div>
      <div class="field"><label for="prof-phone">電話</label><input class="input" id="prof-phone" type="tel" disabled></div>
      <div class="field"><label for="prof-address">聯絡地址</label><input class="input" id="prof-address" disabled></div>
      <div class="field"><label>電子信箱（登入帳號）</label><input class="input" id="prof-email" disabled><div class="hint">🔒 信箱就是登入帳號，不能自己修改，需要更換請聯絡管理人員</div></div>
      <div class="btns" id="prof-save-row" style="display:none"><button class="btn ghost" onclick="toggleProfEdit(false)">取消</button><button class="btn primary" onclick="saveProfile()">儲存</button></div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:.6rem"><b>🏦 銀行資料</b><span class="spacer"></span><button class="btn ghost" id="bank-edit-btn" style="min-height:40px;padding:.3rem .9rem" onclick="toggleBankEdit(true)">修改</button></div>
      <div class="field"><label for="prof-bank-code">銀行代號</label><input class="input" id="prof-bank-code" inputmode="numeric" disabled></div>
      <div class="field"><label for="prof-bank-name">銀行名稱</label><input class="input" id="prof-bank-name" disabled></div>
      <div class="field"><label for="prof-bank-account">銀行帳號</label><input class="input" id="prof-bank-account" inputmode="numeric" disabled></div>
      <div class="btns" id="bank-save-row" style="display:none"><button class="btn ghost" onclick="toggleBankEdit(false)">取消</button><button class="btn primary" onclick="saveBank()">儲存</button></div>
    </div>
    <div class="card">
      <b>🔑 修改密碼</b>
      <div class="err" id="pw-err" role="alert" style="margin-top:.6rem"></div>
      <div class="field" style="margin-top:.6rem"><label for="pw-current">目前密碼</label><input class="input" type="password" id="pw-current" autocomplete="current-password"></div>

<script src="shared.js"></script>
<script>
// ── 小工具 ──────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
// 先跳脫再把網址轉成連結
function linkify(s) {
  return esc(s).replace(/https?:\/\/[^\s<>"']+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
const money = n => '$' + (Number(n) || 0).toLocaleString();
function twNow() { return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' })); }
const pad = n => String(n).padStart(2, '0');
function ymd(d) { return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`; }
function fmtDay(s) {
  if (!s) return '—';
  const [y, m, d] = s.replace(/-/g, '/').split(' ')[0].split('/');
  return `${y}/${pad(m)}/${pad(d)}`;
}
// 'YYYY/MM/DD...' 或 'YYYY/M/D...' 是否落在指定年月
function inMonth(s, y, m) { s = s || ''; return s.startsWith(`${y}/${pad(m)}/`) || s.startsWith(`${y}/${m}/`); }
// 卡片右上角金額：時薪任務在回報前還沒有總額，改顯示時薪
function priceHtml(a) {
  return a.assign_type === 'hourly' && !a.total_price
    ? `<div class="price" style="font-size:1rem">時薪 ${money(a.hourly_wage)}</div>`
    : `<div class="price">${money(a.total_price)}</div>`;
}
function taskLabel(a) { return a.company ? `${a.company}：${a.task_name}` : (a.task_name || ''); }
function taskCode(a) { return a.full_code || a.task_no || ''; }
function attachmentsHtml(atts) {
  if (!atts || !atts.length) return '';
  return `<div>${atts.map(a => `<a class="att" href="/api/task-attachment/${encodeURIComponent(a.drive_id)}" target="_blank" rel="noopener">📎 ${esc(a.name || '附件')}</a>`).join('')}</div>`;
}
function customFieldsHtml(fields) {
  fields = (fields || []).filter(f => f.value !== '' && f.value != null);
  if (!fields.length) return '';
  return `<div style="font-size:.92rem;margin:.3rem 0">${fields.map(f => `<div><span class="muted">${esc(f.label)}：</span>${linkify(f.value)}</div>`).join('')}</div>`;
}
function setBadge(id, n) { const el = $(id); if (!el) return; el.textContent = n; el.style.display = n ? 'inline-flex' : 'none'; }
function closeSheet(id) { $(id).classList.remove('open'); }
function openSheet(id) { $(id).classList.add('open'); const f = $(id).querySelector('input,textarea,select,button.x'); if (f) setTimeout(() => f.focus(), 50); }

// 壓縮圖片（最寬 maxW，JPEG）
function compressImage(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function fileToB64(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }

// ── 頁面切換（用網址 #，手機返回鍵可回上一頁）─────────────────────
const PAGES = ['home', 'take', 'tasks', 'me', 'wallet', 'notices', 'issues', 'profile'];
const NAV_OF = { home: 'home', take: 'take', tasks: 'tasks', me: 'me', wallet: 'me', notices: 'me', issues: 'me', profile: 'me' };
function go(name) { if (location.hash !== '#' + name) location.hash = name; else showPage(name); }
function showPage(name) {
  if (!PAGES.includes(name)) name = 'home';
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
  ['home', 'take', 'tasks', 'me'].forEach(n => {
    const b = $('nav-' + n);
    if (NAV_OF[name] === n) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  if (!booted) return; // 啟動時由 init() 一次載入，不重複讀取
  if (name === 'take') { loadGrab(); loadTasks(); }
  if (name === 'tasks' || name === 'home' || name === 'wallet') loadTasks();
  if (name === 'notices') renderAnnList();
  if (name === 'issues') loadIssues();
}
window.addEventListener('hashchange', () => showPage(location.hash.slice(1)));

function switchToDesktop() {
  try { localStorage.setItem('hiban_view', 'desktop'); } catch (e) {}
  location.href = 'partner.html';
}

// ── 任務資料 ────────────────────────────────────────────────────
let meId = null, me = null, booted = false;
let pending = [], active = [], completed = [], grabList = [];
let asgById = {};

async function loadTasks() {
  try {
    [pending, active, completed] = await Promise.all([
      API.get('/api/assignments/pending'),
      API.get('/api/assignments/active'),
      API.get('/api/assignments/completed'),
    ]);
    asgById = {};
    [...pending, ...active, ...completed].forEach(a => { asgById[a.id] = a; });
    renderPending(); renderActive(); renderDone(); renderWallet(); renderHome(); updateBadges();
    return true;
  } catch (e) { console.warn('loadTasks', e.message); return false; }
}

// 是否被退回、需要修改（最新修改意見比上次回報新，且不在審核中）
function needsFix(a) {
  if (a.review_status) return false;
  const sc = a.supervisor_comments || [];
  if (!sc.length) return false;
  const last = sc[sc.length - 1];
  return !a.comments_resolved_at || `${last.date || ''} ${last.time || ''}` > a.comments_resolved_at;
}
const dueKey = a => { const d = a.deadline_date || a.work_date; return d ? d.replace(/\D/g, '') : '99999999'; };
function dueInfo(a) {
  const d = a.deadline_date || a.work_date;
  if (!d) return null;
  const today = ymd(twNow()).replace(/\D/g, '');
  const tmr = (() => { const t = twNow(); t.setDate(t.getDate() + 1); return ymd(t).replace(/\D/g, ''); })();
  const k = d.replace(/\D/g, '');
  if (k < today) return { cls: 'red', text: '已逾期' };
  if (k === today) return { cls: 'red', text: '今天到期' };
  if (k === tmr) return { cls: 'orange', text: '明天到期' };
  return null;
}

// ── 🏠 首頁 ────────────────────────────────────────────────────
function renderHome() {
  const now = twNow();
  const monthDone = completed.filter(a => inMonth(a.completed_at, now.getFullYear(), now.getMonth() + 1));
  $('home-income').textContent = money(monthDone.reduce((s, a) => s + (a.total_price || 0), 0));
  $('home-done').textContent = monthDone.length ? `・完成 ${monthDone.length} 件` : '';

  const fixes = active.filter(needsFix);
  const due = active.filter(a => a.review_status !== 'reviewing' && !needsFix(a) && dueInfo(a));
  const grabAvail = grabAvailable().length;
  const items = [];
  fixes.forEach(a => items.push(`
    <button class="todo" style="border-left-color:var(--orange)" onclick="openReport(${a.id})">
      <span class="ic">↩️</span><span class="tx"><span class="tt">被退回，需要修改</span><span class="ts" style="display:block">${esc(taskLabel(a))}</span></span><span class="go">修改 ›</span>
    </button>`));
  due.forEach(a => { const d = dueInfo(a); items.push(`
    <button class="todo" style="border-left-color:var(--${d.cls})" onclick="openReport(${a.id})">
      <span class="ic">⏰</span><span class="tx"><span class="tt">${d.text}</span><span class="ts" style="display:block">${esc(taskLabel(a))}</span></span><span class="go">回報 ›</span>
    </button>`); });
  if (pending.length) items.push(`
    <button class="todo" onclick="go('take')">
      <span class="ic">📋</span><span class="tx"><span class="tt">有 ${pending.length} 個指派任務等您回覆</span><span class="ts" style="display:block">接受或拒絕</span></span><span class="go">查看 ›</span>
    </button>`);
  if (grabAvail) items.push(`
    <button class="todo" onclick="go('take')">
      <span class="ic">🎯</span><span class="tx"><span class="tt">有 ${grabAvail} 個限量任務可以接</span><span class="ts" style="display:block">名額有限，先接先得</span></span><span class="go">查看 ›</span>
    </button>`);
  const working = active.filter(a => !needsFix(a) && !dueInfo(a));
  if (working.length) items.push(`
    <button class="todo" style="border-left-color:var(--green)" onclick="go('tasks')">
      <span class="ic">⚔️</span><span class="tx"><span class="tt">${working.length} 個任務進行中</span><span class="ts" style="display:block">${working.filter(a => a.review_status === 'reviewing').length} 個審核中</span></span><span class="go">查看 ›</span>
    </button>`);
  $('home-todo').innerHTML = items.length ? items.join('') : '<div class="card empty">目前沒有待辦事項 🎉<br>可以到「接案」看看有沒有新任務</div>';
}

// ── 🎯 接案：指派 ──────────────────────────────────────────────
function renderPending() {
  setBadge('take-pending-n', pending.length);
  $('take-pending').innerHTML = pending.length ? pending.map(a => `
    <div class="card line">
      <div class="row" style="align-items:flex-start"><div class="t-name" style="flex:1">${esc(taskLabel(a))}</div>${priceHtml(a)}</div>
      <div class="chips">
        ${a.assign_type === 'hourly' ? `<span class="chip yellow">⏱️ 時薪 ${money(a.hourly_wage)}</span>` : `<span class="chip yellow">📦 ${a.quantity} 件・${money(a.unit_price)}</span>`}
        ${a.deadline_date ? `<span class="chip green">⏰ 期限 ${fmtDay(a.deadline_date)}</span>` : ''}
        ${a.work_date ? `<span class="chip">📅 執行 ${fmtDay(a.work_date)}</span>` : ''}
        ${a.assign_type === 'all' ? '<span class="chip orange">📢 開放給大家</span>' : ''}
        ${a.dual_report ? '<span class="chip purple">🔖 雙重回報</span>' : ''}
      </div>
      ${a.notes ? `<div class="box gray">${linkify(a.notes)}</div>` : `<div class="muted">派案人員：${esc(a.supervisor_name || '—')}</div>`}
      ${attachmentsHtml(a.attachments)}${customFieldsHtml(a.custom_fields)}
      <div class="btns">
        <button class="btn danger" onclick="openReject(${a.id})">拒絕</button>
        <button class="btn ok" onclick="acceptTask(${a.id},this)">✅ 接受</button>
      </div>
    </div>`).join('') : '<div class="card empty">目前沒有等您回覆的指派任務</div>';
}
async function acceptTask(id, btn) {
  btn.disabled = true;
  try { await API.put(`/api/assignments/${id}/accept`); showToast('已接受，任務在「我的任務」', 'success'); loadTasks(); }
  catch (e) { showToast(e.message, 'error'); btn.disabled = false; }
}
let rejectId = null;
function openReject(id) {
  rejectId = id;
  $('reject-task').textContent = taskLabel(asgById[id] || {});
  $('reject-reason').value = '';
  openSheet('reject-overlay');
}
async function submitReject() {
  const btn = $('reject-submit'); btn.disabled = true;
  try {
    await API.put(`/api/assignments/${rejectId}/reject`, { reason: $('reject-reason').value.trim() });
    closeSheet('reject-overlay'); showToast('已拒絕這個任務', 'warn'); loadTasks();
  } catch (e) { showToast(e.message, 'error'); }
  btn.disabled = false;
}

// ── 🎯 接案：限量任務 ──────────────────────────────────────────
const PICK_PAGE = 8;
let pickState = {}, grabById = {};
function grabAvailable() {
  return grabList.filter(t => t.pick_mode
    ? (t.slot_data || []).some(s => !s.claimed)
    : ((t.qty_unlimited || t.grabbed_count < t.total_slots)
       && ((t.per_person_limit || 0) === 0 || (t.my_grab_count || 0) < t.per_person_limit)));
}
async function loadGrab() {
  try {
    grabList = await API.get('/api/grab-tasks');
    grabById = {}; grabList.forEach(t => { grabById[t.id] = t; if (!pickState[t.id]) pickState[t.id] = { page: 0, sel: -1 }; });
    renderGrab(); renderHome(); updateBadges();
  } catch (e) { $('take-grab').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}
function quotaLine(t) {
  const lim = t.per_person_limit || 0, got = t.my_grab_count || 0;
  return `<div class="muted">每人可接：${lim === 0 ? '不限' : lim + ' 件'}・我已接 ${got} 件${lim ? `・還可接 ${Math.max(0, lim - got)} 件` : ''}</div>`;
}
function renderGrab() {
  const list = grabAvailable().sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'));
  if (!list.length) { $('take-grab').innerHTML = '<div class="card empty">目前沒有開放中的限量任務</div>'; return; }
  $('take-grab').innerHTML = list.map(t => {
    const head = `
      <div class="row" style="align-items:flex-start"><div class="t-name" style="flex:1">${t.pick_mode ? '🃏 ' : ''}${esc(taskLabel(t))}</div><div class="price">${money(t.unit_price)}</div></div>
      <div class="chips">
        ${t.task_code ? `<span class="chip">🏷️ ${esc(t.task_code)}</span>` : ''}
        ${t.dual_report ? '<span class="chip purple">🔖 雙重回報</span>' : ''}
        <span class="chip orange">⏰ ${t.deadline ? esc(t.deadline.slice(0, 16)) + ' 截止' : '一直開放'}</span>
      </div>
      ${t.work_date ? `<div class="muted">📅 執行日期：${fmtDay(t.work_date)}</div>` : ''}
      ${(t.deadline_days && !t.work_date) ? `<div class="muted">🏁 接案後 ${t.deadline_days} 天內完成</div>` : ''}
      ${quotaLine(t)}
      ${t.notes ? `<div class="box gray">${linkify(t.notes)}</div>` : ''}
      ${attachmentsHtml(t.attachments)}`;
    if (t.pick_mode) return `<div class="card line" style="border-left-color:var(--purple)">${head}<div class="muted" style="margin-top:.4rem">請選一張卡片，再按「確認接案」</div><div id="pick-${t.id}">${pickBody(t)}</div></div>`;
    const remaining = t.qty_unlimited ? null : t.total_slots - t.grabbed_count;
    return `<div class="card line" style="border-left-color:var(--orange)">${head}
      ${customFieldsHtml(t.custom_fields)}
      <div class="muted">${t.qty_unlimited ? `名額不限・已有 ${t.grabbed_count} 人接` : `剩 <b style="color:var(--blue-dd)">${remaining}</b> / ${t.total_slots} 個名額`}</div>
      ${(t.my_grab_nos || []).length ? `<div style="color:var(--green);font-weight:700;margin-top:.2rem">✅ 已接 ${t.my_grab_nos.map(n => '#' + esc(n)).join('、')}</div>` : ''}
      <div style="margin-top:.6rem">${t.my_active
        ? '<button class="btn block" disabled>⏳ 進行中，完成後才能再接</button>'
        : `<button class="btn primary block" onclick="doGrab(${t.id},this)">🎯 接案</button>`}</div>
    </div>`;
  }).join('');
}
function pickBody(t) {
  const slots = t.slot_data || [], st = pickState[t.id];
  const pages = Math.max(1, Math.ceil(slots.length / PICK_PAGE));
  if (st.page >= pages) st.page = pages - 1;
  const start = st.page * PICK_PAGE;
  const cards = slots.slice(start, start + PICK_PAGE).map((s, j) => {
    const idx = start + j, code = s.full_code || ('#' + (idx + 1));
    if (s.claimed) return `<div class="slot taken"><div class="code">${esc(code)}</div><div>已被 ${esc(s.claimed_by_name || '他人')} 選走</div></div>`;
    const fields = (s.custom_fields || []).filter(f => f.value !== '' && f.value != null);
    const detail = fields.length ? fields.map(f => `<div><span class="muted">${esc(f.label)}：</span>${esc(f.value)}</div>`).join('') : (s.title ? `<div>${esc(s.title)}</div>` : '');
    const sel = st.sel === idx;

function calcHourly() {

  if (!(mins > 0)) { box.style.display = 'none'; return; }
  box.textContent = `共 ${Math.floor(mins / 60)} 小時 ${mins % 60} 分 × 時薪 ${money(rp.wage)} ＝ ${money(Math.round(mins / 60 * rp.wage))}`;
  box.style.display = 'block';
}
function reportErr(msg) { const el = $('report-err'); el.textContent = msg; el.style.display = 'block'; el.scrollIntoView({ block: 'center' }); }
async function submitReport() {
  $('report-err').style.display = 'none';
  const btn = $('rp-submit');
  const notes = $('rp-notes').value.trim();
  let body;
  if (rp.stage === 1) {
    if (!rp.files.length) return reportErr('第一階段回報請至少上傳一個附件');
    btn.disabled = true; btn.textContent = '上傳中…';
    const attachments = [];
    for (const f of rp.files) { try { attachments.push({ name: f.name, mime: f.type || 'application/octet-stream', data: await fileToB64(f) }); } catch (e) {} }
    body = { assignment_id: rp.id, notes, attachments };
  } else {
    const url = $('rp-url').value.trim();
    const qty = parseInt($('rp-qty').value) || 0;
    let work_start = '', work_end = '';
    if (rp.hourly) {
      work_start = $('rp-start').value; work_end = $('rp-end').value;
      if (!work_start || !work_end) return reportErr('請填寫開始和完成的時間');
      if (new Date(work_end) <= new Date(work_start)) return reportErr('完成時間要晚於開始時間');
    } else if (rp.stage === 2) {
      if (!url && !rp.images.length) return reportErr('第二階段回報請提供網址或圖片');
    } else if (qty < 1) return reportErr('請填寫完成數量（至少 1）');
    btn.disabled = true; btn.textContent = '送出中…';
    body = { assignment_id: rp.id, completed_qty: qty, url, notes, images: rp.images, work_start, work_end };
  }
  try {
    await API.post('/api/reports', body);
    closeSheet('report-overlay');
    showToast(rp.stage === 1 ? '第一階段已送出，等派案人員核可' : '回報已送出 ✓', 'success');

  $('issue-err').style.display = 'none';
  const toSv = issueTab === 'supervisor';
  $('issue-task-wrap').style.display = toSv ? '' : 'none';
  if (toSv) {
    if (!me.supervisor_id) { showToast('您還沒有負責的派案人員，請改用「回報管理人員」', 'warn'); return; }
    $('issue-target').textContent = '送給派案人員：' + (svName || '讀取中…');
    $('issue-task').innerHTML = '<option value="">不指定</option>' + active.map(t => `<option value="${t.id}">${esc(taskLabel(t))}${taskCode(t) ? ' #' + esc(taskCode(t)) : ''}</option>`).join('');
  } else $('issue-target').textContent = '送給管理人員';
  openSheet('issue-overlay');
}
async function addIssueImages(input) {
  for (const f of Array.from(input.files)) {
    if (issueImgs.length >= 3) { showToast('最多 3 張圖片', 'warn'); break; }
    try { issueImgs.push(await compressImage(f, 600, .7)); } catch (e) { showToast('圖片讀取失敗', 'error'); }
  }
  input.value = ''; renderIssueThumbs();
}
function renderIssueThumbs() {
  $('issue-thumbs').innerHTML = issueImgs.map((d, i) => `<div class="thumb"><img src="${d}" alt="附圖 ${i + 1}"><button aria-label="移除第 ${i + 1} 張圖片" onclick="issueImgs.splice(${i},1);renderIssueThumbs()">✕</button></div>`).join('');
}
async function submitIssue() {
  const err = $('issue-err'); err.style.display = 'none';
  const title = $('issue-title-in').value.trim(), content = $('issue-content').value.trim();
  if (!title || !content) { err.textContent = '請填寫標題和內容'; err.style.display = 'block'; return; }
  const toSv = issueTab === 'supervisor';
  const sel = $('issue-task');
  const body = toSv
    ? { report_type: 'supervisor', title, content, supervisor_id: me.supervisor_id, supervisor_name: svName,
        assignment_id: sel.value || null, assignment_name: sel.value ? sel.options[sel.selectedIndex].textContent : null }
    : { report_type: 'admin', title, content };
  const btn = $('issue-submit'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    const r = await API.post('/api/issues', body);
    for (let i = 0; i < issueImgs.length; i++) await API.post(`/api/issues/${r.id}/image`, { index: i, data: issueImgs[i], mime: 'image/jpeg' });
    closeSheet('issue-overlay'); showToast('回報已送出！', 'success'); loadIssues();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = '送出';
}

// ── 🧑 個人資料 ────────────────────────────────────────────────
let prof = {};
const maskId = s => s && s.length > 4 ? s.slice(0, 2) + '*'.repeat(s.length - 5) + s.slice(-3) : (s || '');
function fillProfile() {
  $('prof-name').value = prof.real_name || ''; $('prof-idno').value = maskId(prof.id_number);
  $('prof-birthday').value = prof.birthday || ''; $('prof-phone').value = prof.phone || '';
  $('prof-address').value = prof.address || ''; $('prof-email').value = prof.email || '';
  $('prof-bank-code').value = prof.bank_code || ''; $('prof-bank-name').value = prof.bank_name || ''; $('prof-bank-account').value = prof.bank_account || '';
}
function toggleProfEdit(on) {
  ['prof-phone', 'prof-address'].forEach(i => { $(i).disabled = !on; });
  $('prof-edit-btn').style.display = on ? 'none' : ''; $('prof-save-row').style.display = on ? 'flex' : 'none';
  if (on) $('prof-phone').focus(); else fillProfile();
}
async function saveProfile() {
  try {
    await API.put('/api/profile', { phone: $('prof-phone').value.trim(), address: $('prof-address').value.trim() });
    prof.phone = $('prof-phone').value.trim(); prof.address = $('prof-address').value.trim();
    toggleProfEdit(false); showToast('個人資料已儲存', 'success');
  } catch (e) { showToast(e.message, 'error'); }
}
function toggleBankEdit(on) {
  ['prof-bank-code', 'prof-bank-name', 'prof-bank-account'].forEach(i => { $(i).disabled = !on; });
  $('bank-edit-btn').style.display = on ? 'none' : ''; $('bank-save-row').style.display = on ? 'flex' : 'none';
  if (on) $('prof-bank-code').focus(); else fillProfile();
}
async function saveBank() {
  const body = { bank_code: $('prof-bank-code').value.trim(), bank_name: $('prof-bank-name').value.trim(), bank_account: $('prof-bank-account').value.trim() };
  try { await API.put('/api/profile/bank', body); Object.assign(prof, body); toggleBankEdit(false); showToast('銀行資料已儲存', 'success'); }
  catch (e) { showToast(e.message, 'error'); }
}
async function changePassword() {
  const err = $('pw-err'); err.style.display = 'none';
  const cur = $('pw-current').value, nw = $('pw-new').value, cf = $('pw-confirm').value;
  const fail = m => { err.textContent = m; err.style.display = 'block'; };
  if (nw.length < 6 || nw.length > 12) return fail('新密碼要 6～12 碼');
  if (nw !== cf) return fail('兩次輸入的新密碼不一樣');
  try {
    await API.post('/api/change-password', { current_password: cur, new_password: nw });
    ['pw-current', 'pw-new', 'pw-confirm'].forEach(i => { $(i).value = ''; });
    showToast('密碼已更新', 'success');
  } catch (e) { fail(e.status === 401 ? '目前密碼不正確' : e.message); }
}

// ── 等級（我的頁一行）──────────────────────────────────────────
async function loadLevel() {
  try {
    const x = await API.get('/api/me/xp');
    const el = $('me-level');
    el.innerHTML = `<div class="row"><span style="font-size:1.4rem">🏆</span><div style="flex:1"><b>Lv.${esc(x.level)} ${esc(x.levelTitle || '')}</b><div class="muted">經驗值 ${esc(x.xp)}${x.xpToNext ? `・再 ${esc(x.xpToNext)} 升級` : ''}</div></div></div>`;
    el.style.display = '';
  } catch (e) {}
}

// ── 角標 ───────────────────────────────────────────────────────
function updateBadges() {
  setBadge('badge-take', pending.length + grabAvailable().length);
  setBadge('badge-tasks', active.filter(needsFix).length);
  const annUnread = meId ? visibleAnns().filter(isUnread).length : 0;
  setBadge('me-ann-n', annUnread); setBadge('me-issue-n', issueUnread);
  setBadge('badge-me', annUnread + issueUnread);
}

// ── 啟動 ───────────────────────────────────────────────────────
function scheduleMidnightLogout() {
  const now = twNow(), mid = new Date(now); mid.setHours(23, 59, 59, 999);
  setTimeout(() => signOut(), mid - now + 1000);
}
async function init() {
  me = await requireAuth(['partner']);
  if (!me) return;
  meId = me.id;
  $('me-name').textContent = me.real_name || '';
  $('ava').textContent = (me.real_name || '夥').slice(-1);
  $('hello-text').textContent = `${me.nickname || me.real_name || ''}，您好！`;
  scheduleMidnightLogout();
  showPage(location.hash.slice(1) || 'home');
  API.get('/api/profile').then(p => { prof = p; fillProfile(); }).catch(() => {});
  if (me.supervisor_id) API.get('/api/users-list?role=supervisor').then(l => { const s = l.find(u => String(u.id) === String(me.supervisor_id)); svName = s ? s.real_name : ''; }).catch(() => {});
  setIssueTab('supervisor');
  loadAnnouncements(); loadGrab(); loadLevel(); syncIssueUnread();
  if (location.hash === '#issues') loadIssues();
  if (!(await loadTasks())) setTimeout(loadTasks, 1500);
  booted = true;
  // 不用即時監聽（省 Firestore 讀取）：回到畫面時更新，平常每 60 秒更新一次
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadTasks(); loadGrab(); } });
  setInterval(() => { if (!document.hidden) loadTasks(); }, 60000);
}
init();
</script>
</body>
</html>
