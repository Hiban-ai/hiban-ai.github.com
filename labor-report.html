<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勞務報酬單</title>
<style>
  * { box-sizing:border-box; }
  body { font-family:'Noto Sans TC','標楷體','DFKai-SB',serif; background:#e8eaed; margin:0; padding:24px; color:#111; }
  .toolbar { max-width:900px; margin:0 auto 16px; display:flex; gap:.6rem; justify-content:flex-end; }
  .toolbar button { padding:.55rem 1.2rem; border:none; border-radius:8px; font-size:.9rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-print { background:#1A8AC0; color:#fff; }
  .btn-back { background:#fff; color:#555; border:1.5px solid #ccc; }
  .sheet { max-width:900px; margin:0 auto; background:#fff; padding:28px; box-shadow:0 4px 20px rgba(0,0,0,.12); }
  table.lr { width:100%; border-collapse:collapse; font-size:16px; table-layout:fixed; }
  table.lr td { border:1.5px solid #000; padding:8px 10px; vertical-align:middle; }
  .t-company { text-align:center; font-size:20px; letter-spacing:2px; padding:12px; }
  .t-title { text-align:center; font-size:19px; font-weight:700; letter-spacing:6px; background:#a9d08e; padding:8px; }
  .lbl { width:110px; text-align:center; background:#fff; white-space:nowrap; }
  .ctr { text-align:center; }
  .boxname { display:inline-block; border:2px solid #000; padding:2px 18px; font-weight:700; }
  .chk { font-size:17px; margin-right:.3rem; }
  .amt td { text-align:center; }
  .sigbox { border:2px solid #000; min-height:46px; }
  #err { max-width:760px; margin:40px auto; text-align:center; color:#c0392b; font-size:16px; }
  @media print {
    body { background:#fff; padding:0; }
    .toolbar { display:none; }
    .sheet { box-shadow:none; max-width:none; padding:6mm; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="btn-print" onclick="window.print()">🖨 列印 / 存成 PDF</button>
    <button class="btn-back" onclick="window.close()">關閉</button>
  </div>
  <div id="err" style="display:none"></div>
  <div class="sheet" id="sheet" style="display:none">
    <table class="lr">
      <colgroup>
        <col style="width:110px"><col style="width:170px"><col><col><col><col><col>
      </colgroup>
      <tr><td colspan="7" class="t-company" id="d-company">希絆股份有限公司</td></tr>
      <tr><td colspan="7" class="t-title">勞務報酬單</td></tr>

      <tr>
        <td class="lbl">茲證明</td>
        <td class="ctr" id="d-name" style="font-weight:700"></td>
        <td colspan="5">確實領取下列款項無誤</td>
      </tr>
      <tr>
        <td class="lbl">工作內容：</td>
        <td colspan="6" id="d-work"></td>
      </tr>

      <tr class="amt">
        <td class="lbl">所得金額：<br>（中文大寫）</td>
        <td class="ctr">新台幣</td>
        <td id="amt-wan"></td><td id="amt-qian"></td><td id="amt-bai"></td><td id="amt-shi"></td><td id="amt-yuan"></td>
      </tr>
      <tr>
        <td class="lbl">代扣稅額</td>
        <td colspan="6" class="ctr" id="d-tax"></td>
      </tr>

      <!-- 支領方式 -->
      <tr>
        <td class="lbl" rowspan="4">支領方式：<br>（擇一勾選）</td>
        <td colspan="2"><span class="chk" id="chk-post">☐</span>郵局轉帳(700)</td>
        <td colspan="2">郵局：<span id="d-post-name"></span><br>戶名：<span id="d-post-holder"></span></td>
        <td>局號：<span id="d-post-code"></span></td>
        <td>帳號：<span id="d-post-acct"></span></td>
      </tr>
      <tr>
        <td colspan="2" rowspan="2"><span class="chk" id="chk-bank">☐</span>銀行轉帳</td>
        <td colspan="2">分行：<span id="d-bank-branch"></span></td>
        <td colspan="2">銀行代碼：<span id="d-bank-code"></span></td>
      </tr>
      <tr>
        <td colspan="2">戶名：<span id="d-bank-holder"></span></td>
        <td colspan="2">銀行帳號：<span id="d-bank-acct"></span></td>
      </tr>
      <tr><td colspan="6"><span class="chk">☐</span>現金</td></tr>

      <tr>
        <td class="lbl">戶籍地址：</td>
        <td colspan="6" id="d-addr"></td>
      </tr>
      <tr>
        <td class="lbl" rowspan="2">通訊地址：</td>
        <td colspan="6"><span class="chk" id="chk-same">☐</span>同戶籍地址</td>
      </tr>
      <tr>
        <td colspan="6"><span class="chk" id="chk-diff">☐</span>非戶籍地址　<span id="d-maddr"></span></td>
      </tr>

      <tr>
        <td class="lbl">聯絡電話：</td>
        <td colspan="2" id="d-phone"></td>
        <td colspan="4">身分證統一編號：<span id="d-idno"></span></td>
      </tr>
      <tr>
        <td class="lbl">所得人簽章：</td>
        <td colspan="2" class="sigbox"></td>
        <td>領取日期：</td>
        <td class="ctr"><span id="d-y"></span> 年</td>
        <td class="ctr"><span id="d-m"></span> 月</td>
        <td class="ctr">＿＿ 日</td>
      </tr>
    </table>
  </div>

<script>
const BIG = ['零','壹','貳','參','肆','伍','陸','柒','捌','玖'];
const UNITS = ['元','拾','佰','仟','萬','拾萬','佰萬','仟萬','億'];
function toCN(n) {
  n = Math.round(n || 0);
  if (n === 0) return '零元整';
  let digits = String(n).split('').map(Number);
  while (digits.length < 5) digits.unshift(0);
  const L = digits.length;
  let out = '';
  for (let i = 0; i < L; i++) out += BIG[digits[i]] + UNITS[L - 1 - i];
  return out + '整';
}
// 取某位數字大寫（place: 萬=4 仟=3 佰=2 拾=1 元=0）
function placeCN(n, place, unit, withZheng) {
  n = Math.round(n || 0);
  const digit = Math.floor(n / Math.pow(10, place)) % 10;
  return BIG[digit] + unit + (withZheng ? '整' : '');
}

(async () => {
  const q = new URLSearchParams(location.search);
  const pid = q.get('partner_id'), ym = q.get('year_month');
  const errEl = document.getElementById('err');
  if (!pid || !ym) { errEl.textContent = '缺少參數'; errEl.style.display = 'block'; return; }
  try {
    const r = await fetch(`/api/admin/labor-report?partner_id=${pid}&year_month=${ym}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '讀取失敗');
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };

    set('d-company', d.company);
    set('d-name', d.real_name);
    set('d-work', '稿費');

    const amt = d.amount || 0;
    set('amt-wan',  placeCN(amt, 4, '萬'));
    set('amt-qian', placeCN(amt, 3, '仟'));
    set('amt-bai',  placeCN(amt, 2, '佰'));
    set('amt-shi',  placeCN(amt, 1, '拾'));
    set('amt-yuan', placeCN(amt, 0, '元', true));

    const tax = amt >= 20000 ? Math.round(amt * 0.1) : 0;
    set('d-tax', toCN(tax) + (amt >= 20000 ? '' : ''));

    const isPost = d.bank_type === 'post';
    document.getElementById('chk-post').textContent = isPost ? '■' : '☐';
    document.getElementById('chk-bank').textContent = isPost ? '☐' : '■';
    if (isPost) {
      // 帳號存成「局號-帳號」，拆開：局號取 post_office_code 或前段，帳號取後段
      const acctParts = (d.bank_account || '').split('-');
      const code = d.post_office_code || acctParts[0] || '';
      const acct = acctParts.length > 1 ? acctParts.slice(1).join('-') : (d.bank_account || '');
      set('d-post-name', d.bank_name || '中華郵政');
      set('d-post-holder', d.bank_holder);
      set('d-post-code', code);
      set('d-post-acct', acct);
    } else {
      set('d-bank-branch', d.bank_branch);
      set('d-bank-code', d.bank_code ? `(${d.bank_code})` : '');
      set('d-bank-holder', d.bank_holder);
      set('d-bank-acct', d.bank_account);
    }

    set('d-addr', d.address || '—');
    const same = !d.mailing_address || d.mailing_address === d.address;
    document.getElementById('chk-same').textContent = same ? '■' : '☐';
    document.getElementById('chk-diff').textContent = same ? '☐' : '■';
    if (!same) set('d-maddr', d.mailing_address);

    set('d-phone', d.phone || '—');
    set('d-idno', d.id_number || '—');
    set('d-y', d.year);
    set('d-m', d.month);

    document.getElementById('sheet').style.display = 'block';
    document.title = `勞務報酬單_${d.real_name}_${d.year}年${d.month}月`;
  } catch(e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
})();
</script>
</body>
</html>
