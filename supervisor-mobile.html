<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>派案人員（手機版）— 希絆雲作所</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mobile.css">
<style>
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.9rem}
.stat{background:#fff;border:none;border-radius:var(--r);padding:.8rem .4rem;box-shadow:0 2px 10px rgba(26,112,160,.08);text-align:center;cursor:pointer;min-height:88px}
.stat .n{font-size:1.7rem;font-weight:700;line-height:1.2;color:var(--blue-dd)}
.stat .n.hot{color:var(--red)}
.stat .l{font-size:.88rem;color:var(--text-m);font-weight:700}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:.15rem .5rem;font-size:.95rem;margin:.4rem 0}
.kv dt{color:var(--text-s)}
.kv dd{word-break:break-word}
.rimgs{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
.rimgs button{border:none;padding:0;background:none;width:84px;height:84px}
.rimgs img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1.5px solid var(--border)}
.viewer{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);align-items:center;justify-content:center;flex-direction:column;gap:.75rem;padding:1rem}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:80vh;border-radius:8px}
.alert-g{border-left:5px solid var(--orange)}
.alert-g.red{border-left-color:var(--red)}
.alert-g li{margin:.2rem 0 .2rem 1.1rem;font-size:.95rem}
.search{position:relative;margin-bottom:.75rem}
</style>
</head>
<body>

<header class="topbar">
  <div class="ava" id="ava" aria-hidden="true">派</div>
  <div class="who">
    <div class="name" id="me-name">—</div>
    <div class="role">派案人員</div>
  </div>
  <button class="logout" onclick="confirmSignOut()">登出</button>
</header>

<main>
  <!-- 🏠 首頁 -->
  <section class="page" id="page-home" aria-labelledby="h-home">
    <h1 class="page-title" id="h-home"><span id="hello-text">您好！</span></h1>
    <div class="stats">
      <button class="stat" onclick="go('review')"><div class="n" id="st-review">—</div><div class="l">待審核</div></button>
      <button class="stat" onclick="go('alerts')"><div class="n" id="st-alerts">—</div><div class="l">預警</div></button>
      <button class="stat" onclick="go('issues')"><div class="n" id="st-issues">—</div><div class="l">未讀問題</div></button>
    </div>
    <div class="section">✅ 等您審核</div>
    <div id="home-review"><div class="empty">載入中…</div></div>
    <div id="home-notices"></div>
  </section>

  <!-- ✅ 審核 -->
  <section class="page" id="page-review" aria-labelledby="h-review">
    <h1 class="page-title" id="h-review">✅ 審核回報</h1>
    <div id="review-list"><div class="empty">載入中…</div></div>
  </section>

  <!-- 👥 夥伴 -->
  <section class="page" id="page-partners" aria-labelledby="h-partners">
    <h1 class="page-title" id="h-partners">👥 我的夥伴</h1>
    <div class="search"><label for="pt-search" class="muted">搜尋姓名或編號</label><input class="input" id="pt-search" type="search" oninput="renderPartners()" placeholder="例：王小明、P012"></div>
    <div id="partner-list"><div class="empty">載入中…</div></div>
  </section>

  <!-- 👤 我的 -->
  <section class="page" id="page-me" aria-labelledby="h-me">
    <h1 class="page-title" id="h-me">👤 我的</h1>
    <nav class="menu" aria-label="我的功能">
      <button onclick="go('alerts')"><span class="ic">⚠️</span>預警通知<span class="count" id="me-alert-n" style="display:none;margin-left:.4rem;background:var(--orange)"></span><span class="arrow">›</span></button>
      <button onclick="go('issues')"><span class="ic">📝</span>問題處理<span class="count" id="me-issue-n" style="display:none;margin-left:.4rem"></span><span class="arrow">›</span></button>
      <button onclick="go('notices')"><span class="ic">📢</span>公告<span class="count" id="me-ann-n" style="display:none;margin-left:.4rem"></span><span class="arrow">›</span></button>
      <button onclick="go('profile')"><span class="ic">🧑</span>個人資料<span class="arrow">›</span></button>
    </nav>
    <div class="card muted" style="font-size:.92rem">💻 派案、派案紀錄、任務紀錄、派案人員紀錄，請用電腦版操作。</div>
    <nav class="menu" aria-label="其他">
      <a href="faq.html"><span class="ic">❓</span>常見問題<span class="arrow">›</span></a>
      <button onclick="switchToDesktop('supervisor.html')"><span class="ic">💻</span>切換電腦版<span class="arrow">›</span></button>
      <button onclick="confirmSignOut()"><span class="ic">🚪</span>登出<span class="arrow">›</span></button>
    </nav>
  </section>

  <!-- 我的 → 預警 -->
  <section class="page" id="page-alerts" aria-labelledby="h-alerts">
    <button class="back" onclick="go('me')">‹ 我的</button>
    <h1 class="page-title" id="h-alerts">⚠️ 預警通知</h1>
    <div id="alert-list"><div class="empty">載入中…</div></div>
  </section>

  <!-- 我的 → 問題處理 -->
  <section class="page" id="page-issues" aria-labelledby="h-issues">
    <button class="back" onclick="go('me')">‹ 我的</button>
    <h1 class="page-title" id="h-issues">📝 問題處理</h1>
    <div class="seg" role="tablist" aria-label="問題分類">
      <button role="tab" id="iss-tab-inbox" aria-selected="true" onclick="setIssueTab('inbox')">夥伴的回報 <span id="iss-n-inbox"></span></button>
      <button role="tab" id="iss-tab-mine" aria-selected="false" onclick="setIssueTab('mine')">我回報管理人員 <span id="iss-n-mine"></span></button>
    </div>
    <button class="btn primary block" id="iss-new-btn" style="display:none;margin-bottom:.4rem" onclick="openIssueForm('')">＋ 回報管理人員</button>
    <div id="iss-list"><div class="empty">載入中…</div></div>
  </section>

  <!-- 我的 → 公告 -->
  <section class="page" id="page-notices" aria-labelledby="h-notices">
    <button class="back" onclick="go('me')">‹ 我的</button>
    <h1 class="page-title" id="h-notices">📢 公告</h1>
    <div class="seg" role="tablist" aria-label="公告分類">
      <button role="tab" id="ann-tab-general" aria-selected="true" onclick="setAnnTab('general')">一般公告 <span id="ann-n-general"></span></button>
      <button role="tab" id="ann-tab-task" aria-selected="false" onclick="setAnnTab('task')">任務通知 <span id="ann-n-task"></span></button>
    </div>
    <div id="ann-list"><div class="empty">載入中…</div></div>
    <button class="btn ghost block" style="margin-top:.5rem" onclick="markAllAnnsRead()">全部標為已讀</button>
  </section>

  <!-- 我的 → 個人資料 -->
  <section class="page" id="page-profile" aria-labelledby="h-profile">
    <button class="back" onclick="go('me')">‹ 我的</button>
    <h1 class="page-title" id="h-profile">🧑 個人資料</h1>
    <div class="card">
      <div class="row" style="margin-bottom:.6rem"><b>基本資料</b><span class="spacer"></span><button class="btn ghost" id="prof-edit-btn" style="min-height:40px;padding:.3rem .9rem" onclick="toggleProfEdit(true)">修改</button></div>
      <div class="field"><label>姓名</label><input class="input" id="prof-name" disabled></div>
      <div class="field"><label>身分證</label><input class="input" id="prof-idno" disabled></div>
      <div class="field"><label>生日</label><input class="input" id="prof-birthday" disabled></div>
      <div class="field"><label for="prof-phone">電話</label><input class="input" id="prof-phone" type="tel" disabled></div>
      <div class="field"><label for="prof-address">聯絡地址</label><input class="input" id="prof-address" disabled></div>
      <div class="field"><label>電子信箱（登入帳號）</label><input class="input" id="prof-email" disabled><div class="hint">🔒 信箱就是登入帳號，不能自己修改，需要更換請聯絡管理人員</div></div>
      <div class="btns" id="prof-save-row" style="display:none"><button class="btn ghost" onclick="toggleProfEdit(false)">取消</button><button class="btn primary" onclick="saveProfile()">儲存</button></div>
    </div>
    <div class="card">
      <b>🔑 修改密碼</b>
      <div class="err" id="pw-err" role="alert" style="margin-top:.6rem"></div>
      <div class="field" style="margin-top:.6rem"><label for="pw-current">目前密碼</label><input class="input" type="password" id="pw-current" autocomplete="current-password"></div>
      <div class="field"><label for="pw-new">新密碼（6～12 碼）</label><input class="input" type="password" id="pw-new" maxlength="12" autocomplete="new-password"></div>
      <div class="field"><label for="pw-confirm">再輸入一次新密碼</label><input class="input" type="password" id="pw-confirm" maxlength="12" autocomplete="new-password"></div>
      <button class="btn primary block" onclick="changePassword()">更新密碼</button>
    </div>
  </section>
</main>

<nav class="nav" aria-label="主選單">
  <button id="nav-home" onclick="go('home')"><span class="ic" aria-hidden="true">🏠</span>首頁</button>
  <button id="nav-review" onclick="go('review')"><span class="ic" aria-hidden="true">✅</span>審核<span class="badge" id="badge-review"></span></button>
  <button id="nav-partners" onclick="go('partners')"><span class="ic" aria-hidden="true">👥</span>夥伴</button>
  <button id="nav-me" onclick="go('me')"><span class="ic" aria-hidden="true">👤</span>我的<span class="badge" id="badge-me"></span></button>
</nav>

<!-- 核可（最後一次）：可加額外獎勵 -->
<div class="sheet-overlay" id="approve-overlay" onclick="if(event.target===this)closeSheet('approve-overlay')">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="approve-title">
    <div class="sheet-head"><div class="t" id="approve-title">核可回報</div><button class="x" aria-label="關閉" onclick="closeSheet('approve-overlay')">✕</button></div>
    <div class="muted" id="approve-task" style="margin-bottom:.6rem"></div>
    <div class="err" id="approve-err" role="alert"></div>
    <div class="field"><label for="approve-extra">額外獎勵（選填，沒有就留空）</label><input class="input" type="number" id="approve-extra" min="0" inputmode="numeric" placeholder="0" oninput="calcApprove()"></div>
    <div class="box green" id="approve-sum"></div>
    <div class="hint">核可後任務會標記為完成，金額算進夥伴這個月的收入。</div>
    <button class="btn ok block" style="margin-top:.75rem" id="approve-submit" onclick="submitApprove()">✓ 確定核可</button>
  </div>
</div>

<!-- 核可雙重回報第一階段：可回覆說明＋附件 -->
<div class="sheet-overlay" id="s1-overlay" onclick="if(event.target===this)closeSheet('s1-overlay')">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="s1-title">
    <div class="sheet-head"><div class="t" id="s1-title">核可第一階段</div><button class="x" aria-label="關閉" onclick="closeSheet('s1-overlay')">✕</button></div>
    <div class="muted" id="s1-task" style="margin-bottom:.6rem"></div>
    <div class="err" id="s1-err" role="alert"></div>
    <div class="field"><label for="s1-note">給夥伴的說明（選填）</label><textarea class="input" id="s1-note" rows="3" placeholder="例：方向正確，請照這個大綱完成全文"></textarea></div>
    <div class="field">
      <label>附件（選填，每個 20MB 以內）</label>
      <label class="upload" for="s1-files">📎 選擇檔案</label>
      <input type="file" id="s1-files" multiple style="display:none" onchange="addFiles(this,'s1')">
      <div id="s1-file-list"></div>
    </div>
    <div class="hint">核可後，夥伴就可以做第二階段回報。</div>
    <button class="btn ok block" style="margin-top:.75rem" id="s1-submit" onclick="submitStage1()">✓ 核可，進入第二階段</button>
  </div>
</div>

<!-- 退回 -->
<div class="sheet-overlay" id="reject-overlay" onclick="if(event.target===this)closeSheet('reject-overlay')">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="reject-title">
    <div class="sheet-head"><div class="t" id="reject-title">退回回報</div><button class="x" aria-label="關閉" onclick="closeSheet('reject-overlay')">✕</button></div>
    <div class="muted" id="reject-task" style="margin-bottom:.6rem"></div>
    <div class="err" id="reject-err" role="alert"></div>
    <div class="field"><label for="reject-reason">退回原因（必填，夥伴會看到）</label><textarea class="input" id="reject-reason" rows="4" placeholder="請具體說明要修改的地方"></textarea></div>
    <div class="field">
      <label>附件（選填，每個 20MB 以內）</label>
      <label class="upload" for="rj-files">📎 選擇檔案</label>
      <input type="file" id="rj-files" multiple style="display:none" onchange="addFiles(this,'rj')">
      <div id="rj-file-list"></div>
    </div>
    <button class="btn danger block" style="margin-top:.75rem" id="reject-submit" onclick="submitReject()">確定退回</button>
  </div>
</div>

<!-- 回報管理人員 -->
<div class="sheet-overlay" id="issue-overlay" onclick="if(event.target===this)closeSheet('issue-overlay')">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="issue-title">
    <div class="sheet-head"><div class="t" id="issue-title">回報管理人員</div><button class="x" aria-label="關閉" onclick="closeSheet('issue-overlay')">✕</button></div>
    <div class="err" id="issue-err" role="alert"></div>
    <div class="field"><label for="issue-title-in">標題</label><input class="input" id="issue-title-in" maxlength="60"></div>
    <div class="field"><label for="issue-content">內容</label><textarea class="input" id="issue-content" rows="4"></textarea></div>
    <div class="field">
      <label>圖片（選填，最多 3 張）</label>
      <label class="upload" for="issue-imgs">📷 拍照或選擇圖片</label>
      <input type="file" id="issue-imgs" accept="image/*" multiple style="display:none" onchange="addIssueImages(this)">
      <div class="thumbs" id="issue-thumbs"></div>
    </div>
    <button class="btn primary block" id="issue-submit" onclick="submitIssue()">送出</button>
  </div>
</div>

<!-- 看回報圖片 -->
<div class="viewer sheet-overlay" id="img-viewer" onclick="if(event.target===this)closeSheet('img-viewer')">
  <img id="img-viewer-src" alt="回報圖片">
  <button class="btn ghost" onclick="closeSheet('img-viewer')">✕ 關閉</button>
</div>

<script src="shared.js"></script>
<script src="mobile.js"></script>
<script>
const PAGES = ['home', 'review', 'partners', 'me', 'alerts', 'issues', 'notices', 'profile'];
const NAV_OF = { alerts: 'me', issues: 'me', notices: 'me', profile: 'me' };
let meId = null, me = null, booted = false;
let reports = [], alerts = null, inbox = [], mine = [], partners = [], unread = { inbox: 0, mine: 0 };

function onShowPage(name) {
  if (!booted) return;
  if (name === 'review' || name === 'home') loadReports();
  if (name === 'partners') loadPartners();
  if (name === 'alerts') loadAlerts();
  if (name === 'issues') loadIssues();
  if (name === 'notices') renderAnnList();
}
const onAnnChange = () => updateBadges();

// ── ✅ 審核 ────────────────────────────────────────────────────
async function loadReports() {
  try { reports = await API.get('/api/reports/supervisor'); }
  catch (e) { $('review-list').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  reports.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  renderReview(); renderHome(); updateBadges();
}
function rLabel(r) { return taskLabel(r) + (taskCode(r) ? ' #' + taskCode(r) : ''); }
function stageText(r) { return r.dual_report ? (r.stage === 1 ? '雙重・第一階段（附件）' : '雙重・第二階段') : ''; }
function reviewCard(r) {
  const hourly = r.assign_type === 'hourly';
  const kv = hourly ? `
      ${r.work_content ? `<dt>工作內容</dt><dd>${linkify(r.work_content)}</dd>` : ''}
      <dt>時間</dt><dd>${esc(r.work_start || '—')} ～ ${esc(r.work_end || '—')}</dd>
      <dt>時數</dt><dd>${Math.floor((r.work_minutes || 0) / 60)} 小時 ${(r.work_minutes || 0) % 60} 分 × ${money(r.hourly_wage)}</dd>
      <dt>金額</dt><dd><b style="color:var(--green)">${money(r.total_price)}</b></dd>`
    : (r.dual_report && r.stage === 1 ? '' : `<dt>完成數量</dt><dd><b style="color:var(--green)">${r.completed_qty || 0}</b> / ${r.task_quantity || '—'} 件</dd>`);
  return `
  <div class="card line">
    <div class="t-name">${esc(rLabel(r))}</div>
    <div class="chips">
      <span class="chip">👤 ${esc(r.partner_name || '—')}</span>
      ${stageText(r) ? `<span class="chip purple">🔖 ${stageText(r)}</span>` : ''}
      <span class="chip gray" style="background:var(--bg);color:var(--text-m)">📅 ${esc((r.created_at || '').slice(5, 16))} 送出</span>
    </div>
    <dl class="kv">
      ${kv}
      ${r.url ? `<dt>回報網址</dt><dd>${linkify(r.url)}</dd>` : ''}
      ${r.notes ? `<dt>說明</dt><dd style="white-space:pre-wrap">${linkify(r.notes)}</dd>` : ''}
      ${r.deadline_date ? `<dt>完成期限</dt><dd>${fmtDay(r.deadline_date)}</dd>` : ''}
      ${r.work_date ? `<dt>執行日期</dt><dd>${fmtDay(r.work_date)}</dd>` : ''}
      ${(r.custom_fields || []).filter(f => f.value !== '' && f.value != null).map(f => `<dt>${esc(f.label)}</dt><dd>${linkify(f.value)}</dd>`).join('')}
    </dl>
    ${(r.images || []).length ? `<div class="muted">回報圖片（點圖放大）</div><div class="rimgs">${r.images.map((im, i) => `<button aria-label="放大第 ${i + 1} 張圖片" onclick="viewImg(${r.id},${i})"><img src="${im.data}" alt="回報圖片 ${i + 1}"></button>`).join('')}</div>` : ''}
    ${(r.stage_attachments || []).length ? `<div class="muted">第一階段附件</div>${attachmentsHtml(r.stage_attachments)}` : ''}
    <div class="btns">
      <button class="btn danger" onclick="openReject(${r.id})">退回</button>
      <button class="btn ok" onclick="${r.dual_report && r.stage === 1 ? `openStage1(${r.id})` : `openApprove(${r.id})`}">${r.dual_report && r.stage === 1 ? '✓ 核可第一階段' : '✓ 核可'}</button>
    </div>
  </div>`;
}
function renderReview() {
  $('review-list').innerHTML = reports.length ? reports.map(reviewCard).join('') : '<div class="card empty">目前沒有待審核的回報 🎉</div>';
}
function viewImg(id, i) {
  const r = reports.find(x => x.id === id);
  if (!r) return;
  $('img-viewer-src').src = r.images[i].data;
  openSheet('img-viewer');
}

let cur = null, files = { s1: [], rj: [] };
const byId = id => reports.find(x => x.id === id);
function openApprove(id) {
  cur = byId(id); if (!cur) return;
  $('approve-task').textContent = `${rLabel(cur)}・${cur.partner_name || ''}`;
  $('approve-extra').value = ''; $('approve-err').style.display = 'none';
  calcApprove(); $('approve-submit').disabled = false;
  openSheet('approve-overlay');
}
function approveBase() { return Math.max(0, (cur.total_price || 0) - (cur.extra_reward || 0)); }
function calcApprove() {
  const extra = Math.max(0, parseInt($('approve-extra').value) || 0), base = approveBase();
  $('approve-sum').innerHTML = `原金額 <b>${money(base)}</b>${extra ? ` ＋ 額外獎勵 <b>${money(extra)}</b>` : ''}<br>總金額 <b style="font-size:1.15rem">${money(base + extra)}</b>`;
}
async function submitApprove() {
  const btn = $('approve-submit'), extra = Math.max(0, parseInt($('approve-extra').value) || 0);
  btn.disabled = true;
  try {
    await API.put(`/api/reports/${cur.id}/approve`, { extra_reward: extra });
    closeSheet('approve-overlay');
    showToast(extra ? `已核可，含額外獎勵 ${money(extra)}` : '已核可，任務完成 ✓', 'success');
    loadReports();
  } catch (e) { const el = $('approve-err'); el.textContent = e.message; el.style.display = 'block'; btn.disabled = false; }
}
function openStage1(id) {
  cur = byId(id); if (!cur) return;
  $('s1-task').textContent = `${rLabel(cur)}・${cur.partner_name || ''}`;
  $('s1-note').value = ''; $('s1-err').style.display = 'none';
  files.s1 = []; renderFiles('s1'); $('s1-submit').disabled = false;
  openSheet('s1-overlay');
}
function openReject(id) {
  cur = byId(id); if (!cur) return;
  $('reject-task').textContent = `${rLabel(cur)}・${cur.partner_name || ''}`;
  $('reject-reason').value = ''; $('reject-err').style.display = 'none';
  files.rj = []; renderFiles('rj'); $('reject-submit').disabled = false;
  openSheet('reject-overlay');
}
function addFiles(input, key) {
  for (const f of input.files) {
    if (f.size > 20 * 1024 * 1024) { showToast(`「${f.name}」超過 20MB`, 'error'); continue; }
    files[key].push(f);
  }
  input.value = ''; renderFiles(key);
}
function renderFiles(key) {
  $(key + '-file-list').innerHTML = files[key].map((f, i) => `<div class="filechip">📄 <span>${esc(f.name)}</span><button aria-label="移除 ${esc(f.name)}" onclick="files.${key}.splice(${i},1);renderFiles('${key}')">✕</button></div>`).join('');
}
async function filesPayload(list) {
  const out = [];
  for (const f of list) { try { out.push({ name: f.name, mime: f.type || 'application/octet-stream', data: await fileToB64(f) }); } catch (e) {} }
  return out;
}
async function submitStage1() {
  const btn = $('s1-submit'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    await API.put(`/api/reports/${cur.id}/approve`, { reply_note: $('s1-note').value.trim(), reply_attachments: await filesPayload(files.s1) });
    closeSheet('s1-overlay'); showToast('已核可第一階段，夥伴可以做第二階段', 'success'); loadReports();
  } catch (e) { const el = $('s1-err'); el.textContent = e.message; el.style.display = 'block'; }
  btn.disabled = false; btn.textContent = '✓ 核可，進入第二階段';
}
async function submitReject() {
  const reason = $('reject-reason').value.trim(), err = $('reject-err');
  if (!reason) { err.textContent = '請填寫退回原因'; err.style.display = 'block'; return; }
  const btn = $('reject-submit'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    await API.put(`/api/reports/${cur.id}/reject`, { reason, reply_attachments: await filesPayload(files.rj) });
    closeSheet('reject-overlay'); showToast('已退回，意見已傳給夥伴', 'warn'); loadReports();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = '確定退回';
}

// ── 🏠 首頁 ────────────────────────────────────────────────────
function renderHome() {
  $('st-review').textContent = reports.length;
  $('st-review').classList.toggle('hot', reports.length > 0);
  $('home-review').innerHTML = reports.length
    ? reports.slice(0, 3).map(r => `<button class="todo" onclick="go('review')"><span class="ic">📝</span><span class="tx"><span class="tt">${esc(r.partner_name || '')}</span><span class="ts" style="display:block">${esc(rLabel(r))}${stageText(r) ? '・' + stageText(r) : ''}</span></span><span class="go">審核 ›</span></button>`).join('')
      + (reports.length > 3 ? `<a href="#review" class="muted" style="display:block;text-align:center;padding:.4rem">還有 ${reports.length - 3} 筆 ›</a>` : '')
    : '<div class="card empty">目前沒有待審核的回報 🎉</div>';
}

// ── ⚠️ 預警 ────────────────────────────────────────────────────
const ALERT_GROUPS = [
  { key: 'income_warning', icon: '💰', red: true, title: '夥伴當月金額接近上限', item: x => `${x.real_name}：當月累計 ${money(x.amount)}（上限 $19,000）` },
  { key: 'overdue', icon: '🔴', red: true, title: '任務已逾期', item: x => `${x.task_name}（${x.partner_name || '未指派'}）期限 ${x.deadline_date}` },
  { key: 'due_soon', icon: '🟠', title: '任務即將到期', item: x => `${x.task_name}（${x.partner_name || '未指派'}）期限 ${x.deadline_date}` },
  { key: 'pending_worklogs', icon: '📝', title: '回報待審核', item: x => `任務 #${x.assignment_id} 的回報待審核` },
  { key: 'rejected', icon: '↩️', red: true, title: '被拒絕，需要重新指派', item: x => `${x.task_name}${x.reject_reason ? '：' + x.reject_reason : ''}` },
  { key: 'grab_unfilled', icon: '🎯', title: '限量任務名額未滿且快截止', item: x => `${x.task_name}：${x.grabbed_count}/${x.total_slots}，${x.deadline} 截止` },
  { key: 'inactive_partners', icon: '😴', red: true, title: '夥伴很久沒登入', item: x => `${x.real_name}：${(x.login_dates || []).length ? '上次登入 ' + x.login_dates[x.login_dates.length - 1] : '還沒登入過'}` },
  { key: 'unassigned_partners', icon: '❓', title: '夥伴還沒有派案人員', item: x => x.real_name },
];
async function loadAlerts() {
  try { alerts = await API.get('/api/supervisor/alerts'); }
  catch (e) { $('alert-list').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  let total = 0;
  const html = ALERT_GROUPS.map(g => {
    const arr = alerts[g.key] || [];
    if (!arr.length) return '';
    total += arr.length;
    const li = x => `<li>${esc(g.item(x))}</li>`;
    return `<div class="card alert-g${g.red ? ' red' : ''}">
      <b>${g.icon} ${g.title}（${arr.length}）</b>
      <ul>${arr.slice(0, 5).map(li).join('')}</ul>
      ${arr.length > 5 ? `<details class="more"><summary>再看 ${arr.length - 5} 筆</summary><ul>${arr.slice(5).map(li).join('')}</ul></details>` : ''}
    </div>`;
  }).join('');
  $('alert-list').innerHTML = html || '<div class="card empty">目前沒有需要注意的事項 🎉</div>';
  $('st-alerts').textContent = total;
  $('st-alerts').classList.toggle('hot', total > 0);
  setBadge('me-alert-n', total);
}

// ── 👥 夥伴 ────────────────────────────────────────────────────
async function loadPartners() {
  try { partners = await API.get('/api/supervisor/partners'); }
  catch (e) { $('partner-list').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  renderPartners();
}
const pNo = p => p.partner_no ? 'P' + String(p.partner_no).padStart(3, '0') : '';
function renderPartners() {
  const q = ($('pt-search').value || '').trim().toLowerCase();
  let list = partners.slice().sort((a, b) => (a.partner_no || 9999) - (b.partner_no || 9999));
  if (q) list = list.filter(p => (p.real_name || '').toLowerCase().includes(q) || pNo(p).toLowerCase().includes(q));
  $('partner-list').innerHTML = list.length ? list.map(p => {
    const st = p.status === 'active' ? '' : `<span class="chip red">${p.status === 'pending' ? '待審核' : '停用'}</span>`;
    return `<details class="card" style="padding:.85rem 1rem">
      <summary style="list-style:none;cursor:pointer;min-height:44px">
        <div class="row"><b style="flex:1">${esc(p.real_name)} <span class="muted">${pNo(p)}</span></b>${st}</div>
        <div class="muted">進行中 ${p.active_count || 0}${p.reviewing_count ? `（待審 ${p.reviewing_count}）` : ''}・本月完成 ${p.month_tasks || 0} 件</div>
      </summary>
      <dl class="kv" style="margin-top:.6rem">
        <dt>電話</dt><dd>${p.phone ? `<a href="tel:${esc(p.phone)}">📞 ${esc(p.phone)}</a>` : '—'}</dd>
        <dt>身份別</dt><dd>${esc(p.identity || '—')}</dd>
        <dt>本月收入</dt><dd>${money(p.month_income)}</dd>
        <dt>累計收入</dt><dd>${money(p.total_income)}</dd>
        <dt>已完成</dt><dd>${p.completed_count || 0} 件</dd>
        <dt>最近完成</dt><dd>${p.last_report ? fmtDay(p.last_report) : '—'}</dd>
      </dl>
    </details>`;
  }).join('') : '<div class="card empty">找不到符合的夥伴</div>';
}

// ── 📝 問題處理 ────────────────────────────────────────────────
let issueTab = 'inbox', issueImgs = [];
function setIssueTab(t) {
  issueTab = t;
  ['inbox', 'mine'].forEach(x => $('iss-tab-' + x).setAttribute('aria-selected', x === t));
  $('iss-new-btn').style.display = t === 'mine' ? '' : 'none';
  renderIssues();
}
async function loadIssues() {
  try {
    const [a, b] = await Promise.all([API.get('/api/issues/inbox/supervisor'), API.get('/api/issues/mine')]);
    inbox = a; mine = b.filter(r => r.report_type === 'admin');
  } catch (e) { inbox = []; mine = []; }
  renderIssues(); syncIssueUnread();
}
async function syncIssueUnread() {
  try { const d = await API.get('/api/issues/unread'); unread = { inbox: d.from_reporter || 0, mine: d.from_handler || 0 }; } catch (e) {}
  $('iss-n-inbox').textContent = unread.inbox ? `(${unread.inbox})` : '';
  $('iss-n-mine').textContent = unread.mine ? `(${unread.mine})` : '';
  $('st-issues').textContent = unread.inbox + unread.mine;
  $('st-issues').classList.toggle('hot', unread.inbox + unread.mine > 0);
  updateBadges();
}
function issueCard(r) {
  const st = { pending: ['待處理', 'orange'], processing: ['處理中', ''], resolved: ['已解決', 'green'] }[r.status] || [r.status, ''];
  const isInbox = issueTab === 'inbox';
  const isUnreadI = isInbox ? r.unread_handler : r.unread_reporter;
  const roleName = { partner: '工作夥伴', supervisor: '派案人員', staff: '管理人員' };
  return `<details class="card" style="padding:.85rem 1rem" ontoggle="if(this.open)markIssueRead(${r.id})">
    <summary style="list-style:none;cursor:pointer;min-height:44px">
      <div class="row">${isUnreadI ? '<span class="dot" aria-label="未讀"></span>' : ''}<b style="flex:1;min-width:0">${esc(r.title)}</b><span class="chip ${st[1]}">${st[0]}</span></div>
      <div class="muted">${isInbox ? esc(r.reporter_name || '') + '・' : ''}${fmtDay(r.created_at)}${r.replies && r.replies.length ? `・💬 ${r.replies.length}` : ''}</div>
    </summary>
    <div class="box gray" style="margin-top:.6rem">${linkify(r.content)}</div>
    ${r.assignment_name ? `<div class="muted">📎 關聯任務：${esc(r.assignment_name)}</div>` : ''}
    ${r.image_count > 0 ? `<div class="thumbs">${Array.from({ length: r.image_count }, (_, i) => `<a href="/api/issues/${r.id}/image/${i}" target="_blank" rel="noopener" class="thumb"><img src="/api/issues/${r.id}/image/${i}" alt="附圖 ${i + 1}"></a>`).join('')}</div>` : ''}
    ${(r.replies || []).map(rp => `<div class="box ${rp.author_role === 'supervisor' ? 'gray' : 'green'}"><span class="lbl">${esc(rp.author_name)}（${esc(roleName[rp.author_role] || rp.author_role)}）・${fmtDay(rp.created_at)}</span>${linkify(rp.text)}</div>`).join('')}
    <div class="field" style="margin-top:.6rem"><label for="iss-reply-${r.id}">回覆</label><textarea class="input" id="iss-reply-${r.id}" rows="2"></textarea></div>
    <button class="btn primary block" onclick="replyIssue(${r.id})">送出回覆</button>
    ${isInbox ? `<div class="btns">
      ${r.status === 'pending' ? `<button class="btn ghost" onclick="setIssueStatus(${r.id},'processing')">標為處理中</button>` : ''}
      <button class="btn ghost" onclick="openIssueForm(${r.id})">轉給管理人員</button>
    </div>` : ''}
  </details>`;
}
function renderIssues() {
  const list = issueTab === 'inbox' ? inbox : mine;
  $('iss-list').innerHTML = list.length ? list.map(issueCard).join('') : `<div class="card empty">${issueTab === 'inbox' ? '目前沒有夥伴的問題回報' : '還沒有回報紀錄'}</div>`;
}
async function markIssueRead(id) {
  const r = [...inbox, ...mine].find(x => x.id === id);
  if (!r) return;
  const flag = issueTab === 'inbox' ? 'unread_handler' : 'unread_reporter';
  if (!r[flag]) return;
  try { await API.put(`/api/issues/${id}/read`, {}); r[flag] = false; syncIssueUnread(); } catch (e) {}
}
async function replyIssue(id) {
  const text = $('iss-reply-' + id).value.trim();
  if (!text) { showToast('請輸入回覆內容', 'warn'); return; }
  try { await API.post(`/api/issues/${id}/reply`, { text }); showToast('回覆已送出', 'success'); await loadIssues(); }
  catch (e) { showToast(e.message, 'error'); }
}
async function setIssueStatus(id, status) {
  try { await API.put(`/api/issues/${id}/status`, { status }); showToast('狀態已更新', 'success'); await loadIssues(); }
  catch (e) { showToast(e.message, 'error'); }
}
function openIssueForm(fromId) {
  const src = fromId ? inbox.find(x => x.id === fromId) : null;
  issueImgs = []; renderIssueThumbs();
  $('issue-title-in').value = src ? ('轉報：' + src.title).slice(0, 60) : '';
  $('issue-content').value = src ? `${src.reporter_name || ''} 回報：\n${src.content || ''}` : '';
  $('issue-err').style.display = 'none';
  openSheet('issue-overlay');
}
async function addIssueImages(input) {
  for (const f of Array.from(input.files)) {
    if (issueImgs.length >= 3) { showToast('最多 3 張圖片', 'warn'); break; }
    try { issueImgs.push(await compressImage(f, 600, .7)); } catch (e) { showToast('圖片讀取失敗', 'error'); }
  }
  input.value = ''; renderIssueThumbs();
}
function renderIssueThumbs() {
  $('issue-thumbs').innerHTML = issueImgs.map((d, i) => `<div class="thumb"><img src="${d}" alt="附圖 ${i + 1}"><button aria-label="移除第 ${i + 1} 張圖片" onclick="issueImgs.splice(${i},1);renderIssueThumbs()">✕</button></div>`).join('');
}
async function submitIssue() {
  const err = $('issue-err'); err.style.display = 'none';
  const title = $('issue-title-in').value.trim(), content = $('issue-content').value.trim();
  if (!title || !content) { err.textContent = '請填寫標題和內容'; err.style.display = 'block'; return; }
  const btn = $('issue-submit'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    const r = await API.post('/api/issues', { report_type: 'admin', title, content });
    for (let i = 0; i < issueImgs.length; i++) await API.post(`/api/issues/${r.id}/image`, { index: i, data: issueImgs[i], mime: 'image/jpeg' });
    closeSheet('issue-overlay'); showToast('已送給管理人員', 'success');
    setIssueTab('mine'); loadIssues();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = '送出';
}

// ── 角標 ───────────────────────────────────────────────────────
function updateBadges() {
  setBadge('badge-review', reports.length);
  const annUnread = meId ? visibleAnns().filter(isUnread).length : 0;
  const iss = unread.inbox + unread.mine;
  setBadge('me-ann-n', annUnread); setBadge('me-issue-n', iss);
  setBadge('badge-me', annUnread + iss);
}

// ── 啟動 ───────────────────────────────────────────────────────
async function init() {
  me = await requireAuth(['supervisor']);
  if (!me) return;
  meId = me.id;
  $('me-name').textContent = me.real_name || '';
  $('ava').textContent = (me.real_name || '派').slice(-1);
  $('hello-text').textContent = `${me.nickname || me.real_name || ''}，您好！`;
  scheduleMidnightLogout();
  showPage(location.hash.slice(1) || 'home');
  API.get('/api/profile').then(p => { prof = p; fillProfile(); }).catch(() => {});
  setIssueTab('inbox');
  loadAnnouncements(); loadAlerts(); loadIssues();
  if (location.hash === '#partners') loadPartners();
  await loadReports();
  booted = true;
  // 不用即時監聽（省 Firestore 讀取）：回到畫面時更新，平常每 60 秒更新待審核
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadReports(); syncIssueUnread(); } });
  setInterval(() => { if (!document.hidden) loadReports(); }, 60000);
}
init();
</script>
</body>
</html>
